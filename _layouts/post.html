---
layout: default
---
<section class="post">
  <div class="wrap--prose">
    <p class="post__kicker">
      <a href="{{ '/blog/' | relative_url }}">← Follow the build</a>
    </p>
    <h1 class="post__title">{{ page.title }}<span class="cw-dot">.</span></h1>
    <p class="post__date">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
    </p>
    <div class="post__body">
      {{ content }}
    </div>
  </div>
</section>
